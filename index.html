<title>PATSFIVE 集客ダッシュボード 2026-27</title>
<style>
  :root {
    --court: #E96003;
    --gold: #F7AC00;
    --ink: #1A1A2E;
    --paper: #F6F3EF;
    --card: #FFFFFF;
    --line: #E5E0D8;
    --mut: #8B8578;
    --ok: #2E9E5B;
    --ng: #C0392B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 40px; }

  header {
    background: var(--ink);
    color: #fff;
    border-bottom: 4px solid var(--court);
    padding: 16px 0 14px;
    margin-bottom: 14px;
  }
  header .wrap { padding-bottom: 0; }
  header h1 { font-size: 18px; letter-spacing: 0.02em; }
  header h1 b { color: var(--gold); }
  .head-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; align-items: center; }
  .pill {
    display: inline-block; font-size: 11px; font-weight: bold;
    padding: 3px 10px; border-radius: 999px;
  }
  .pill.next { background: var(--court); color: #fff; }
  .pill.ro { background: rgba(255,255,255,.14); color: #E8E4DC; font-weight: normal; }
  .updated { font-size: 11px; color: #B9B4A8; width: 100%; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .scard {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    border-top: 3px solid var(--court); padding: 10px 12px;
  }
  .scard h3 { font-size: 11px; color: var(--mut); font-weight: normal; margin-bottom: 2px; }
  .scard .big { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .scard .big small { font-size: 12px; color: var(--mut); font-weight: normal; }
  .scard .big.ok { color: var(--ok); }
  .scard .big.ng { color: var(--ng); }
  .scard .sub { font-size: 10.5px; color: var(--mut); margin-top: 2px; line-height: 1.5; }
  .bar { height: 7px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--court), var(--gold)); }

  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 12px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 14px; color: var(--court); margin-bottom: 8px; }
  .legend { display: flex; gap: 5px 14px; flex-wrap: wrap; font-size: 11px; color: #555; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .lg { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }
  svg { display: block; width: 100%; height: auto; }

  .month-h {
    font-size: 12px; font-weight: bold; color: var(--mut);
    letter-spacing: 0.08em; margin: 18px 2px 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .month-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .game {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .game.is-next { border: 2px solid var(--gold); background: #FFFBEF; }
  .game.is-done { background: #FBFDFB; }
  .g-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .g-date { font-weight: bold; font-size: 14px; font-variant-numeric: tabular-nums; }
  .g-opp { font-size: 13px; }
  .chip { font-size: 10px; font-weight: bold; padding: 1px 8px; border-radius: 4px; }
  .chip.ube { background: #EFEBE4; color: #6B6455; }
  .chip.shimo { background: #FDE4CB; color: #A34400; }
  .chip.key { background: var(--gold); color: var(--ink); border-radius: 999px; }
  .chip.nextlabel { background: var(--court); color: #fff; border-radius: 999px; }
  .g-nums {
    display: flex; gap: 4px; margin-top: 8px;
  }
  .g-num { flex: 1; text-align: center; background: var(--paper); border-radius: 6px; padding: 4px 2px; }
  .game.is-next .g-num { background: #FFF3D6; }
  .g-num i { display: block; font-style: normal; font-size: 10px; color: var(--mut); }
  .g-num b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .g-num b.dim { color: #AAA49A; font-weight: normal; }
  .g-num b.gp { color: var(--ok); }
  .g-num b.gm { color: var(--ng); }
  .g-memo { font-size: 11px; color: var(--mut); margin-top: 7px; padding-left: 8px; border-left: 3px solid var(--line); }

  footer { text-align: center; font-size: 11px; color: var(--mut); padding: 20px 14px 0; line-height: 1.8; }

  @media (min-width: 560px) {
    .cards { grid-template-columns: repeat(4, 1fr); }
    header h1 { font-size: 21px; }
  }
</style>

<header>
  <div class="wrap">
    <h1>&#127936; PATSFIVE <b>集客ダッシュボード</b> 2026-27</h1>
    <div class="head-meta">
      <span class="pill next" id="nextGame">--</span>
      <span class="pill ro">閲覧専用（実績入力は社内ダッシュボードから）</span>
      <span class="updated" id="updated"></span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cards" id="summaryCards"></div>

  <div class="panel">
    <h2>累計推移</h2>
    <div class="legend">
      <span><i class="lg" style="background:#E96003;"></i>目標</span>
      <span><i class="lg" style="background:#2E9E5B;"></i>実績</span>
      <span><i class="lg" style="background:#999;"></i>予測（現状延長）</span>
      <span><i class="lg" style="background:#CFCAC0;"></i>昨年同時期</span>
    </div>
    <div id="cumChart"></div>
  </div>

  <div class="panel">
    <h2>試合別 来場者数（バー＝実績・グレー＝予測／━＝目標）</h2>
    <div id="barChart"></div>
  </div>

  <h2 style="font-size:14px;color:var(--court);margin:4px 2px 0;">試合一覧</h2>
  <div id="gameList"></div>
</div>

<footer id="footer"></footer>

<script>
const DATA = {

    {"no":8,"setsu":"第8節","game":"G2","date":"2026-11-29","venue":"下関","opp":"湘南ユナイテッドBC","key":false,"target":1500,"pred":910,"lastYear":782,"actual":null,"memo":""},
    {"no":9,"setsu":"第10節","game":"G1","date":"2026-12-19","venue":"宇部","opp":"湘南ユナイテッドBC","key":false,"target":1500,"pred":810,"lastYear":601,"actual":null,"memo":"クリスマス前週末"},
    {"no":10,"setsu":"第10節","game":"G2","date":"2026-12-20","venue":"宇部","opp":"湘南ユナイテッドBC","key":false,"target":1500,"pred":990,"lastYear":913,"actual":null,"memo":""},
    {"no":11,"setsu":"第12節","game":"G1","date":"2027-01-23","venue":"宇部","opp":"しながわシティ","key":false,"target":1500,"pred":1010,"lastYear":951,"actual":null,"memo":""},
    {"no":12,"setsu":"第12節","game":"G2","date":"2027-01-24","venue":"宇部","opp":"しながわシティ","key":false,"target":1500,"pred":1230,"lastYear":1428,"actual":null,"memo":""},
    {"no":13,"setsu":"第14節","game":"G1","date":"2027-02-06","venue":"宇部","opp":"しながわシティ","key":false,"target":1500,"pred":1040,"lastYear":1406,"actual":null,"memo":"昨年比較対象は下関開催"},
    {"no":14,"setsu":"第14節","game":"G2","date":"2027-02-07","venue":"宇部","opp":"しながわシティ","key":false,"target":1500,"pred":1270,"lastYear":1486,"actual":null,"memo":"昨年比較対象は下関開催"},
    {"no":15,"setsu":"第15節","game":"G1","date":"2027-02-13","venue":"下関","opp":"ヴィアティン三重","key":true,"target":2000,"pred":1270,"lastYear":1228,"actual":null,"memo":"下関第2弾"},
    {"no":16,"setsu":"第15節","game":"G2","date":"2027-02-14","venue":"下関","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1550,"lastYear":1280,"actual":null,"memo":"バレンタイン当日"},
    {"no":17,"setsu":"第17節","game":"G1","date":"2027-02-27","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1040,"lastYear":1228,"actual":null,"memo":"レノファ山口ホーム戦と同週末の可能性"},
    {"no":18,"setsu":"第17節","game":"G2","date":"2027-02-28","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1270,"lastYear":1280,"actual":null,"memo":""},
    {"no":19,"setsu":"第20節","game":"G1","date":"2027-03-27","venue":"下関","opp":"ヴィアティン三重","key":true,"target":2000,"pred":1140,"lastYear":755,"actual":null,"memo":"春休み期間・下関第3弾"},
    {"no":20,"setsu":"第20節","game":"G2","date":"2027-03-28","venue":"下関","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1390,"lastYear":829,"actual":null,"memo":""},
    {"no":21,"setsu":"第22節","game":"G1","date":"2027-04-10","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":830,"lastYear":866,"actual":null,"memo":""},
    {"no":22,"setsu":"第22節","game":"G2","date":"2027-04-11","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1020,"lastYear":964,"actual":null,"memo":""},
    {"no":23,"setsu":"第23節","game":"G1","date":"2027-04-17","venue":"宇部","opp":"湘南ユナイテッドBC","key":false,"target":1500,"pred":830,"lastYear":866,"actual":null,"memo":"レノファ山口ホーム戦と同週末の可能性"},
    {"no":24,"setsu":"第23節","game":"G2","date":"2027-04-18","venue":"宇部","opp":"湘南ユナイテッドBC","key":true,"target":2000,"pred":1120,"lastYear":964,"actual":null,"memo":"ホーム最終戦"}
  ]
};

const fmt = n => n == null ? "" : n.toLocaleString("ja-JP");
const today = new Date(); today.setHours(0,0,0,0);
const gdate = g => new Date(g.date + "T00:00:00");
const WD = ["日","月","火","水","木","金","土"];
const played = () => DATA.games.filter(g => g.actual != null);
const nextGame = () => DATA.games.find(g => gdate(g) >= today && g.actual == null);

// サマリー
(function renderSummary() {
  const gs = DATA.games, pl = played();
  const cumT = pl.reduce((s,g)=>s+g.target,0);
  const cumA = pl.reduce((s,g)=>s+g.actual,0);
  const avgA = pl.length ? Math.round(cumA/pl.length) : null;
  const hit = pl.filter(g=>g.actual>=g.target).length;
  const totalT = gs.reduce((s,g)=>s+g.target,0);
  const diff = cumA - cumT;
  const pct = cumT ? Math.round(cumA/cumT*100) : 0;
  let html = "";
  html += `<div class="scard"><h3>消化試合</h3><div class="big">${pl.length}<small> / ${gs.length}試合</small></div><div class="sub">目標合計 ${fmt(totalT)}人</div></div>`;
  html += `<div class="scard"><h3>実績 vs 目標（消化分）</h3><div class="big ${diff>=0?'ok':'ng'}">${pl.length?(diff>=0?'+':'')+fmt(diff):'--'}<small> 人</small></div><div class="sub">実績${fmt(cumA)}／目標${fmt(cumT)}（${pl.length?pct+'%':'--'}）</div><div class="bar"><div style="width:${Math.min(100,pct)}%"></div></div></div>`;
  html += `<div class="scard"><h3>平均来場（基準1,500）</h3><div class="big ${avgA==null?'':(avgA>=1500?'ok':'ng')}">${avgA==null?'--':fmt(avgA)}<small> 人</small></div><div class="sub">${avgA==null?'実績入力後に表示':(avgA>=1500?'基準クリア中':'基準まであと'+fmt(1500-avgA)+'人')}</div></div>`;
  html += `<div class="scard"><h3>目標達成試合</h3><div class="big">${pl.length?hit:'--'}<small>${pl.length?' / '+pl.length+'試合':''}</small></div><div class="sub">重点2,000／その他1,500</div></div>`;
  document.getElementById("summaryCards").innerHTML = html;
  const ng = nextGame();
  document.getElementById("nextGame").textContent = ng
    ? `次戦 ${ng.date.slice(5).replace("-","/")}(${WD[gdate(ng).getDay()]}) ${ng.venue} vs ${ng.opp}`
    : "全日程終了";
  document.getElementById("updated").textContent =
    `データ更新：${new Date(DATA.savedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})}（${DATA.savedBy}）`;
})();

// 累計チャート
(function renderCumChart() {
  const gs = DATA.games, n = gs.length;
  let ct=0, cp=0, cl=0, ca=0;
  const rows = gs.map(g => {
    ct+=g.target; cp+=g.pred; cl+=g.lastYear;
    if (g.actual!=null) ca+=g.actual;
    return { t:ct, p:cp, l:cl, a:(g.actual!=null?ca:null) };
  });
  const W=360, H=220, PL=40, PB=26, PT=8, PR=8;
  const maxY = Math.ceil(ct/10000)*10000;
  const x = i => PL + (W-PL-PR) * i/(n-1);
  const y = v => PT + (H-PT-PB) * (1 - v/maxY);
  const line = (key,color,width,dash) => {
    const pts = rows.map((r,i)=> r[key]==null?null:`${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).filter(Boolean);
    return pts.length ? `<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:""}/>` : "";
  };
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (let v=0; v<=maxY; v+=10000) {
    svg += `<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="#EFEBE4"/>`;
    svg += `<text x="${PL-4}" y="${y(v)+3}" text-anchor="end" font-size="8" fill="#8B8578">${v/10000?v/1000+'k':'0'}</text>`;
  }
  gs.forEach((g,i)=>{
    if (i%4===0) svg += `<text x="${x(i)}" y="${H-PB+13}" text-anchor="middle" font-size="8" fill="#8B8578">${g.date.slice(5).replace("-","/")}</text>`;
  });
  svg += line("l","#CFCAC0",1.5);
  svg += line("p","#999",1.5,"4,3");
  svg += line("t","#E96003",2,"2,3");
  svg += line("a","#2E9E5B",3);
  rows.forEach((r,i)=>{ if(r.a!=null) svg += `<circle cx="${x(i)}" cy="${y(r.a)}" r="3.2" fill="#2E9E5B"/>`; });
  svg += `</svg>`;
  document.getElementById("cumChart").innerHTML = svg;
})();

// 試合別バー
(function renderBarChart() {
  const gs = DATA.games, n = gs.length;
  const W=360, H=190, PL=32, PB=24, PT=8, PR=6;
  const maxY = 2500;
  const bw = (W-PL-PR)/n * 0.55;
  const x = i => PL + (W-PL-PR) * (i+0.5)/n;
  const y = v => PT + (H-PT-PB) * (1 - Math.min(v,maxY)/maxY);
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (let v=0; v<=maxY; v+=500) {
    svg += `<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}" stroke="${v===1500?'#F7AC00':'#EFEBE4'}" ${v===1500?'stroke-dasharray="4,3"':''}/>`;
    svg += `<text x="${PL-4}" y="${y(v)+3}" text-anchor="end" font-size="8" fill="#8B8578">${v.toLocaleString()}</text>`;
  }
  svg += `<text x="${W-PR}" y="${y(1500)-3}" text-anchor="end" font-size="8" fill="#B8860B">基準1,500</text>`;
  gs.forEach((g,i)=>{
    const cx = x(i);
    if (g.actual!=null) {
      const col = g.actual>=g.target ? "#2E9E5B" : "#E96003";
      svg += `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(g.actual)}" width="${bw.toFixed(1)}" height="${((H-PB)-y(g.actual)).toFixed(1)}" fill="${col}" rx="1.5"/>`;
    } else {
      svg += `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(g.pred)}" width="${bw.toFixed(1)}" height="${((H-PB)-y(g.pred)).toFixed(1)}" fill="#E9E5DD" rx="1.5"/>`;
    }
    svg += `<line x1="${(cx-bw*0.8).toFixed(1)}" y1="${y(g.target)}" x2="${(cx+bw*0.8).toFixed(1)}" y2="${y(g.target)}" stroke="#1A1A2E" stroke-width="1.6"/>`;
    if (i%4===0) svg += `<text x="${cx}" y="${H-PB+12}" text-anchor="middle" font-size="8" fill="#8B8578">${g.date.slice(5).replace("-","/")}</text>`;
    if (g.venue==="下関") svg += `<text x="${cx}" y="${H-PB+21}" text-anchor="middle" font-size="7" fill="#E96003">下関</text>`;
  });
  svg += `</svg>`;
  document.getElementById("barChart").innerHTML = svg;
})();

// 試合一覧（月ごと）
(function renderList() {
  const ng = nextGame();
  let html = "", curMonth = "";
  DATA.games.forEach(g=>{
    const d = gdate(g);
    const mkey = `${d.getFullYear()}年${d.getMonth()+1}月`;
    if (mkey !== curMonth) { curMonth = mkey; html += `<div class="month-h">${mkey}</div>`; }
    const isNext = ng && g.no===ng.no;
    const done = g.actual!=null;
    const gap = done ? g.actual-g.target : null;
    html += `<div class="game ${isNext?'is-next':done?'is-done':''}">
      <div class="g-top">
        <span class="g-date">${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})</span>
        <span class="chip ${g.venue==='下関'?'shimo':'ube'}">${g.venue}</span>
        <span class="g-opp">vs ${g.opp}</span>
        ${g.key?'<span class="chip key">★重点</span>':''}
        ${isNext?'<span class="chip nextlabel">次戦</span>':''}
      </div>
      <div class="g-nums">
        <div class="g-num"><i>目標</i><b>${fmt(g.target)}</b></div>
        <div class="g-num"><i>予測</i><b class="dim">${fmt(g.pred)}</b></div>
        <div class="g-num"><i>昨年</i><b class="dim">${fmt(g.lastYear)}</b></div>
        <div class="g-num"><i>実績</i><b>${done?fmt(g.actual):'<span style="color:#C5BFB3;font-weight:normal;">未</span>'}</b></div>
        <div class="g-num"><i>GAP</i><b class="${gap==null?'':gap>=0?'gp':'gm'}">${gap==null?'--':(gap>=0?'+':'')+fmt(gap)}</b></div>
      </div>
      ${g.memo?`<div class="g-memo">${g.memo}</div>`:''}
    </div>`;
  });
  document.getElementById("gameList").innerHTML = html;
})();

document.getElementById("footer").textContent = DATA.note;
</script>
