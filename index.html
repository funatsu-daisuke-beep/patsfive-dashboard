const b2a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const concat = (...arrs) => {
  const total = arrs.reduce((n,a)=>n+a.length,0);
  const out = new Uint8Array(total);
  let off = 0;
  for (const a of arrs) { out.set(a, off); off += a.length; }
  return out;
};
async function tryDecrypt(pw) {
  const salt = b2a(ENC.salt), iv = b2a(ENC.iv), mac = b2a(ENC.mac), ct = b2a(ENC.ct);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: salt, iterations: ENC.iter, hash: "SHA-256" }, base, 512));
  const hmacKey = await crypto.subtle.importKey("raw", bits.slice(32, 64), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const valid = await crypto.subtle.verify("HMAC", hmacKey, mac, concat(salt, iv, ct));
  if (!valid) return null;
  const aesKey = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, aesKey, ct);
  return new TextDecoder("utf-8").decode(plain);
}
async function attempt(pw, silent) {
  const err = document.getElementById("err"), loading = document.getElementById("loading");
  err.style.display = "none"; loading.style.display = "block";
  try {
    const html = await tryDecrypt(pw);
    if (html) {
      localStorage.setItem("patsfive_dash_pw", pw);
      document.open(); document.write(html); document.close();
      return;
    }
  } catch (e) {}
  loading.style.display = "none";
  if (!silent) { err.style.display = "block"; }
}
document.getElementById("btn").addEventListener("click", () => attempt(document.getElementById("pw").value, false));
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") attempt(e.target.value, false); });
const saved = localStorage.getItem("patsfive_dash_pw");
if (saved) attempt(saved, true);
