<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PATSFIVE ダッシュボード</title>
<style>
  :root {
    --bg: #E8E8E8;
    --sh-dark: #C8C8C8;
    --sh-light: #FFFFFF;
    --primary: #FF6B00;
    --primary-dark: #CC5500;
    --primary-light: #FF8F3E;
    --text: #333333;
    --text-sub: #888888;
    --text-dim: #AAAAAA;
    --green: #27AE60;
    --red: #C0392B;
    --r: 16px;
    --raised: 6px 6px 14px var(--sh-dark), -4px -4px 10px var(--sh-light);
    --raised-sm: 3px 3px 8px var(--sh-dark), -2px -2px 6px var(--sh-light);
    --inset: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 14px 48px; }

  /* HEADER */
  header {
    background: var(--bg);
    border-bottom: 3px solid var(--primary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    position: sticky; top: 0; z-index: 200;
    padding: 12px 0 10px; margin-bottom: 16px;
  }
  .header-inner { max-width: 720px; margin: 0 auto; padding: 0 14px; }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .header-icon {
    width: 40px; height: 40px; border-radius: 50%;
    box-shadow: var(--raised-sm); flex-shrink: 0;
    object-fit: contain; padding: 3px; background: var(--bg);
  }
  .header-top h1 { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: .01em; }
  .header-top h1 span { color: var(--primary); }
  .header-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill-next {
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    color: #fff;
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 999px;
    box-shadow: 2px 3px 8px rgba(255,107,0,0.3);
  }
  .pill-ro {
    background: var(--bg); color: var(--text-sub);
    font-size: 10px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px;
    box-shadow: var(--inset);
  }
  .updated { font-size: 10px; color: var(--text-dim); width: 100%; margin-top: 2px; }

  /* STATS */
  .stats-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-tile {
    background: var(--bg); box-shadow: var(--raised);
    border-radius: var(--r); padding: 13px 14px;
    position: relative; overflow: hidden;
  }
  .stat-tile::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
  }
  .stat-label {
    font-size: 10px; color: var(--text-sub);
    margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
    font-weight: 600;
  }
  .stat-label::before {
    content: ""; width: 5px; height: 5px;
    background: var(--primary); border-radius: 50%;
    box-shadow: 0 0 5px rgba(255,107,0,.5); flex-shrink: 0;
  }
  .stat-value { font-size: 22px; font-weight: 800; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
  .stat-value.ok { color: var(--green); }
  .stat-value.ng { color: var(--red); }
  .stat-unit { font-size: 11px; font-weight: 400; color: var(--text-sub); margin-left: 2px; }
  .stat-sub { font-size: 10px; color: var(--text-sub); margin-top: 4px; line-height: 1.4; }
  .progress-bar {
    height: 4px; background: var(--sh-dark);
    border-radius: 2px; overflow: hidden; margin-top: 6px;
    box-shadow: var(--inset);
  }
  .progress-bar > div { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); }

  /* PANELS */
  .panel { background: var(--bg); box-shadow: var(--raised); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
  .panel-h {
    padding: 12px 16px; font-weight: 700; font-size: 13px;
    color: var(--primary); border-bottom: 1px solid var(--sh-dark);
    letter-spacing: .03em;
  }
  .panel-body { padding: 14px; }
  .legend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .lg { display: inline-block; width: 16px; height: 4px; border-radius: 2px; }
  svg { display: block; width: 100%; height: auto; }

  /* MONTH HEADER */
  .month-h {
    font-size: 11px; font-weight: 700; color: var(--text-sub);
    letter-spacing: .1em; margin: 18px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .month-h::after { content: ""; flex: 1; height: 1px; background: var(--sh-dark); }

  /* GAME CARDS */
  .game-card {
    background: var(--bg); box-shadow: var(--raised);
    border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px;
  }
  .game-card.is-next {
    box-shadow: var(--raised), inset 4px 0 0 var(--primary);
  }
  .g-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
  .g-date { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .g-opp { font-size: 13px; }
  .chip {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
    background: var(--bg); color: var(--text-sub); box-shadow: var(--raised-sm);
  }
  .chip.shimo { background: rgba(255,107,0,.1); color: var(--primary-dark); box-shadow: none; border-radius: 6px; }
  .chip.key { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; border-radius: 999px; box-shadow: 1px 2px 6px rgba(255,107,0,.3); }
  .chip.nextlabel { background: linear-gradient(90deg, var(--primary), var(--primary-light)); color: #fff; border-radius: 999px; box-shadow: 1px 2px 6px rgba(255,107,0,.3); }

  .g-nums { display: flex; gap: 5px; }
  .g-num {
    flex: 1; text-align: center; background: var(--bg);
    border-radius: 8px; padding: 5px 2px; box-shadow: var(--inset);
  }
  .g-num i { display: block; font-style: normal; font-size: 9px; color: var(--text-sub); margin-bottom: 2px; }
  .g-num b { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text); }
  .g-num b.dim { color: var(--text-sub); font-weight: normal; font-size: 13px; }
  .g-num b.gp { color: var(--green); }
  .g-num b.gm { color: var(--red); }

  .g-memo { font-size: 11px; color: var(--text-sub); margin-top: 8px; padding-left: 8px; border-left: 3px solid rgba(255,107,0,.3); }

  footer { text-align: center; font-size: 10px; color: var(--text-dim); padding: 16px 14px 0; letter-spacing: .04em; }

  /* LINK CARDS */
  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .link-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 18px 10px 14px;
    background: var(--bg); box-shadow: var(--raised); border-radius: var(--r);
    text-decoration: none; color: var(--text);
    font-size: 12px; font-weight: 700; text-align: center;
    position: relative; overflow: hidden;
  }
  .link-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
  }
  .link-card:active { box-shadow: var(--inset); }
  .link-card-icon {
    font-size: 22px; line-height: 1;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); border-radius: 50%;
    box-shadow: var(--raised-sm);
  }

  @media (min-width: 560px) {
    .stats-bar { grid-template-columns: repeat(4, 1fr); }
    .header-top h1 { font-size: 19px; }
    .link-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>

<header>

  <div id="gameList"></div>
</div>

<footer id="footer"></footer>

    {"no":21,"setsu":"第22節","game":"G1","date":"2027-04-10","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":830,"lastYear":866,"actual":null,"memo":""},
    {"no":22,"setsu":"第22節","game":"G2","date":"2027-04-11","venue":"宇部","opp":"ヴィアティン三重","key":false,"target":1500,"pred":1020,"lastYear":964,"actual":null,"memo":""},
    {"no":23,"setsu":"第23節","game":"G1","date":"2027-04-17","venue":"宇部","opp":"湘南ユナイテッドBC","key":false,"target":1500,"pred":830,"lastYear":866,"actual":null,"memo":"レノファ山口ホーム戦と同週末の可能性"},
    {"no":24,"setsu":"第23節","game":"G2","date":"2027-04-18","venue":"宇部","opp":"湘南ユナイテッドBC","key":true,"target":2000,"pred":1120,"lastYear":964,"actual":null,"memo":"ホーム最終戦"}
  ]
};

const fmt = n => n == null ? "" : n.toLocaleString("ja-JP");
const today = new Date(); today.setHours(0,0,0,0);
const gdate = g => new Date(g.date + "T00:00:00");
const WD = ["日","月","火","水","木","金","土"];
const played = () => DATA.games.filter(g => g.actual != null);
const nextGame = () => DATA.games.find(g => gdate(g) >= today && g.actual == null);

(function renderSummary() {
  const gs = DATA.games, pl = played();
  const cumT = pl.reduce((s,g)=>s+g.target,0);
  const cumA = pl.reduce((s,g)=>s+g.actual,0);
  const avgA = pl.length ? Math.round(cumA/pl.length) : null;
  const hit  = pl.filter(g=>g.actual>=g.target).length;
  const totalT = gs.reduce((s,g)=>s+g.target,0);
  const diff = cumA - cumT;
  const pct  = cumT ? Math.round(cumA/cumT*100) : 0;
  const tiles = [
    {label:"消化試合", val:pl.length, unit:"/ "+gs.length+"試合", sub:"目標合計 "+fmt(totalT)+"人"},
    {label:"実績 vs 目標（消化分）", val:pl.length?(diff>=0?"+":"")+fmt(diff):"--", unit:"人",
     cls:pl.length?(diff>=0?"ok":"ng"):"",
     sub:pl.length?"実績"+fmt(cumA)+"／目標"+fmt(cumT)+"（"+pct+"%）":"実績入力後に表示", pct:pl.length?Math.min(100,pct):null},
    {label:"平均来場（基準1,500人）", val:avgA==null?"--":fmt(avgA), unit:avgA!=null?"人":"",
     cls:avgA==null?"":(avgA>=1500?"ok":"ng"),
     sub:avgA==null?"実績入力後に表示":(avgA>=1500?"基準クリア中":"基準まであと"+fmt(1500-avgA)+"人")},
    {label:"目標達成試合", val:pl.length?hit:"--", unit:pl.length?"/ "+pl.length+"試合":"",
     sub:"重点2,000 ／ その他1,500"},
  ];
  document.getElementById("summaryCards").innerHTML = tiles.map(t =>
    '<div class="stat-tile">'+
      '<div class="stat-label">'+t.label+'</div>'+
      '<div class="stat-value'+(t.cls?" "+t.cls:"")+'">'+(t.val||"--")+'<span class="stat-unit">'+(t.unit||"")+"</span></div>"+
      '<div class="stat-sub">'+t.sub+"</div>"+
      (t.pct!=null?'<div class="progress-bar"><div style="width:'+t.pct+'%"></div></div>':"")+"</div>"
  ).join("");
  const ng = nextGame();
  document.getElementById("nextGame").textContent = ng
    ? "次戦 "+ng.date.slice(5).replace("-","/")+"("+WD[gdate(ng).getDay()]+") "+ng.venue+" vs "+ng.opp
    : "全日程終了";
  document.getElementById("updated").textContent =
    "データ更新："+new Date(DATA.savedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})+"（"+DATA.savedBy+"）";
})();

(function renderCumChart() {
  const gs=DATA.games,n=gs.length;
  var ct=0,cp=0,cl=0,ca=0;
  const rows=gs.map(function(g){
    ct+=g.target;cp+=g.pred;cl+=g.lastYear;
    if(g.actual!=null) ca+=g.actual;
    return {t:ct,p:cp,l:cl,a:(g.actual!=null?ca:null)};
  });
  const W=360,H=220,PL=42,PB=26,PT=8,PR=8;
  const maxY=Math.ceil(ct/10000)*10000;
  const x=i=>PL+(W-PL-PR)*i/(n-1);
  const y=v=>PT+(H-PT-PB)*(1-v/maxY);
  const line=(key,color,width,dash)=>{
    const pts=rows.map((r,i)=>r[key]==null?null:x(i).toFixed(1)+","+y(r[key]).toFixed(1)).filter(Boolean);
    return pts.length?"<polyline points=\""+pts.join(" ")+"\" fill=\"none\" stroke=\""+color+"\" stroke-width=\""+width+"\" "+(dash?"stroke-dasharray=\""+dash+"\"":"")+" />":"";
  };
  let svg="<svg viewBox=\"0 0 "+W+" "+H+"\" xmlns=\"http://www.w3.org/2000/svg\">";
  for(let v=0;v<=maxY;v+=10000){
    svg+="<line x1=\""+PL+"\" y1=\""+y(v).toFixed(1)+"\" x2=\""+(W-PR)+"\" y2=\""+y(v).toFixed(1)+"\" stroke=\"#D8D8D8\"/>";
    svg+="<text x=\""+(PL-4)+"\" y=\""+(y(v)+3)+"\" text-anchor=\"end\" font-size=\"8\" fill=\"#AAAAAA\">"+(v/10000?(v/1000+"k"):"0")+"</text>";
  }
  gs.forEach((g,i)=>{
    if(i%4===0) svg+="<text x=\""+x(i).toFixed(1)+"\" y=\""+(H-PB+13)+"\" text-anchor=\"middle\" font-size=\"8\" fill=\"#BBBBBB\">"+g.date.slice(5).replace("-","/")+"</text>";
  });
  svg+=line("l","#C9C9D2",1.5);
  svg+=line("p","#ABABAB",1.5,"4,3");
  svg+=line("t","#FF6B00",2,"2,3");
  svg+=line("a","#27AE60",3);
  rows.forEach((r,i)=>{ if(r.a!=null) svg+="<circle cx=\""+x(i).toFixed(1)+"\" cy=\""+y(r.a).toFixed(1)+"\" r=\"3.5\" fill=\"#27AE60\"/>"; });
  svg+="</svg>";
  document.getElementById("cumChart").innerHTML=svg;
})();

(function renderBarChart() {
  const gs=DATA.games,n=gs.length;
  const W=360,H=190,PL=34,PB=28,PT=8,PR=6;
  const maxY=2500;
  const bw=(W-PL-PR)/n*0.55;
  const x=i=>PL+(W-PL-PR)*(i+0.5)/n;
  const y=v=>PT+(H-PT-PB)*(1-Math.min(v,maxY)/maxY);
  let svg="<svg viewBox=\"0 0 "+W+" "+H+"\" xmlns=\"http://www.w3.org/2000/svg\">";
  for(let v=0;v<=maxY;v+=500){
    const isB=v===1500;
    svg+="<line x1=\""+PL+"\" y1=\""+y(v).toFixed(1)+"\" x2=\""+(W-PR)+"\" y2=\""+y(v).toFixed(1)+"\" stroke=\""+(isB?"rgba(255,107,0,.35)":"#D8D8D8")+"\" "+(isB?"stroke-dasharray=\"4,3\" stroke-width=\"1.5\"":"")+"/>";
    svg+="<text x=\""+(PL-4)+"\" y=\""+(y(v)+3)+"\" text-anchor=\"end\" font-size=\"8\" fill=\"#AAAAAA\">"+v.toLocaleString()+"</text>";
  }
  svg+="<text x=\""+(W-PR)+"\" y=\""+(y(1500)-3)+"\" text-anchor=\"end\" font-size=\"8\" fill=\"rgba(255,107,0,.8)\">基準1,500</text>";
  gs.forEach((g,i)=>{
    const cx=x(i);
    if(g.actual!=null){
      svg+="<rect x=\""+(cx-bw/2).toFixed(1)+"\" y=\""+y(g.actual).toFixed(1)+"\" width=\""+bw.toFixed(1)+"\" height=\""+((H-PB)-y(g.actual)).toFixed(1)+"\" fill=\""+(g.actual>=g.target?"#27AE60":"#FF6B00")+"\" rx=\"2\" opacity=\"0.85\"/>";
    } else {
      svg+="<rect x=\""+(cx-bw/2).toFixed(1)+"\" y=\""+y(g.pred).toFixed(1)+"\" width=\""+bw.toFixed(1)+"\" height=\""+((H-PB)-y(g.pred)).toFixed(1)+"\" fill=\"#D0D0D0\" rx=\"2\"/>";
    }
    svg+="<line x1=\""+(cx-bw*0.8).toFixed(1)+"\" y1=\""+y(g.target).toFixed(1)+"\" x2=\""+(cx+bw*0.8).toFixed(1)+"\" y2=\""+y(g.target).toFixed(1)+"\" stroke=\"#555\" stroke-width=\"1.8\"/>";
    if(i%4===0) svg+="<text x=\""+cx.toFixed(1)+"\" y=\""+(H-PB+13)+"\" text-anchor=\"middle\" font-size=\"8\" fill=\"#BBBBBB\">"+g.date.slice(5).replace("-","/")+"</text>";
    if(g.venue==="下関") svg+="<text x=\""+cx.toFixed(1)+"\" y=\""+(H-PB+23)+"\" text-anchor=\"middle\" font-size=\"7\" fill=\"#FF6B00\">下</text>";
  });
  svg+="</svg>";
  document.getElementById("barChart").innerHTML=svg;
})();

(function renderList() {
  const ng=nextGame();
  let html="",curMonth="";
  DATA.games.forEach(g=>{
    const d=gdate(g);
    const mkey=(d.getFullYear()+"年"+(d.getMonth()+1)+"月");
    if(mkey!==curMonth){ curMonth=mkey; html+="<div class=\"month-h\">"+mkey+"</div>"; }
    const isNext=ng&&g.no===ng.no, done=g.actual!=null;
    const gap=done?g.actual-g.target:null;
    html+="<div class=\"game-card"+(isNext?" is-next":done?" is-done":"")+"\">";
    html+="<div class=\"g-top\">";
    html+="<span class=\"g-date\">"+(d.getMonth()+1)+"/"+(d.getDate())+"("+WD[d.getDay()]+")</span>";
    html+="<span class=\"chip "+(g.venue==="下関"?"shimo":"")+"\">"+(g.venue==="下関"?"下関":"宇部")+"</span>";
    html+="<span class=\"g-opp\">vs "+g.opp+"</span>";
    if(g.key) html+="<span class=\"chip key\">★重点</span>";
    if(isNext) html+="<span class=\"chip nextlabel\">次戦</span>";
    html+="</div>";
    html+="<div class=\"g-nums\">";
    html+="<div class=\"g-num\"><i>目標</i><b>"+fmt(g.target)+"</b></div>";
    html+="<div class=\"g-num\"><i>予測</i><b class=\"dim\">"+fmt(g.pred)+"</b></div>";
    html+="<div class=\"g-num\"><i>昨年</i><b class=\"dim\">"+fmt(g.lastYear)+"</b></div>";
    html+="<div class=\"g-num\"><i>実績</i><b>"+(done?fmt(g.actual):"<span style=\"color:#C8C8C8;font-weight:normal;\">未</span>")+"</b></div>";
    html+="<div class=\"g-num\"><i>GAP</i><b class=\""+(gap==null?"":gap>=0?"gp":"gm")+"\">"+(gap==null?"--":(gap>=0?"+":"")+fmt(gap))+"</b></div>";
    html+="</div>";
    if(g.memo) html+="<div class=\"g-memo\">"+g.memo+"</div>";
    html+="</div>";
  });
  document.getElementById("gameList").innerHTML=html;
})();
